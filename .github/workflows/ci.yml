name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: markbook doctor || true
      # Docker isolation tests need a small local image; pull one so they run instead of skipping.
      - run: docker pull busybox:latest
      - run: pytest -q
        env:
          MARKBOOK_TEST_IMAGE: busybox:latest
