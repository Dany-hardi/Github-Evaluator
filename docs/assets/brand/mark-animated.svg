<svg xmlns="http://www.w3.org/2000/svg" viewBox="13 5 38 56" role="img" aria-label="Markbook">
  <style>
    .all { transform-box: fill-box; transform-origin: 50% 50%; animation: drop 7s ease-out infinite; }
    .hl  { transform-box: fill-box; transform-origin: 0 50%; animation: swipe 7s ease-out infinite; }
    .tk  { stroke-dasharray: 1; animation: draw 7s ease-out infinite; }
    @keyframes drop  { 0% { transform: translateY(-26px) rotate(-9deg); opacity: 0 } 7% { opacity: 1 } 13% { transform: translateY(1.5px) rotate(1deg) } 17%, 93% { transform: none; opacity: 1 } 99%, 100% { opacity: 0 } }
    @keyframes swipe { 0%, 15% { transform: scaleX(0) } 22%, 100% { transform: scaleX(1) } }
    @keyframes draw  { 0%, 20% { stroke-dashoffset: 1 } 30%, 100% { stroke-dashoffset: 0 } }
    @media (prefers-reduced-motion: reduce) { .all, .hl, .tk { animation: none !important; stroke-dashoffset: 0; transform: none } }
  </style>
  <g class="all">
    <path d="M19 13a4 4 0 0 1 4-4h18a4 4 0 0 1 4 4v43l-13-10-13 10z" fill="#19B37D"/>
    <path class="hl" d="M21.5 27.2l20.4-2.6.9 6.6-20.4 2.6z" fill="#FFD43B"/>
    <path class="tk" pathLength="1" d="M25.6 30.4l5.2 5.2 8.6-11.4" fill="none" stroke="#10223A" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
