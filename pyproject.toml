[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markbook"
version = "3.0.0"
description = "Markbook: grade Git repositories against a rubric-as-code spec. Sandboxed, reproducible, and built so a human only reviews what a machine cannot decide."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["grading", "education", "git", "autograder", "rubric", "sandbox", "podman", "docker", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Education :: Testing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
web = ["Flask>=3.0"]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8", "jsonschema>=4", "Flask>=3.0", "anthropic>=1.0"]

[project.urls]
Homepage = "https://github.com/Dany-hardi/markbook"
Source = "https://github.com/Dany-hardi/markbook"
Issues = "https://github.com/Dany-hardi/markbook/issues"
Documentation = "https://github.com/Dany-hardi/markbook/blob/main/docs/DESIGN.md"

[project.scripts]
markbook = "markbook.cli:main"

[tool.setuptools.packages.find]
include = ["markbook*"]

[tool.setuptools.package-data]
markbook = ["schema/*.json", "web/templates/*.html", "web/static/*", "web/static/fonts/*",
            "ai_fixtures/manifest.json", "ai_fixtures/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a working container runtime (Docker or Podman) and a locally cached image"]
